name: Build K8s Offline Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-k8s-offline.yml"
      - ".gitignore"
      - "README.md"
      - "build.sh"
      - "install.sh"
      - "versions.env"
      - "common/**"
  pull_request:
    paths:
      - ".github/workflows/build-k8s-offline.yml"
      - ".gitignore"
      - "README.md"
      - "build.sh"
      - "install.sh"
      - "versions.env"
      - "common/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        bundle:
          - full
          - lite
        cni:
          - ''          # 默认 cilium
          - calico
        exclude:
          - bundle: lite
            cni: calico  # lite 包不构建 calico 变体

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Sealos downloads
        uses: actions/cache@v4
        with:
          path: .cache/downloads
          key: sealos-downloads-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.cni }}-${{ hashFiles('common/component-versions.env') }}
          restore-keys: |
            sealos-downloads-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.cni }}-

      - name: Ensure executable permissions
        run: |
          chmod +x build.sh install.sh

      - name: Build package
        run: |
          ./build.sh --arch "${{ matrix.arch }}" --bundle "${{ matrix.bundle }}" --force \
          ${{ matrix.cni != '' && format('--cni {0}', matrix.cni) || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k8s-sealos-${{ matrix.arch }}-${{ matrix.bundle }}${{ matrix.cni != '' && format('-{0}', matrix.cni) || '' }}
          path: |
            dist/k8s-sealos-linux-${{ matrix.arch }}-${{ matrix.bundle }}${{ matrix.cni != '' && format('-{0}', matrix.cni) || '' }}.run
            dist/k8s-sealos-linux-${{ matrix.arch }}-${{ matrix.bundle }}${{ matrix.cni != '' && format('-{0}', matrix.cni) || '' }}.run.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*