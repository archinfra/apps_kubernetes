name: Build K8s Offline Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-k8s-offline.yml"
      - ".gitignore"
      - "README.md"
      - "build.sh"
      - "install.sh"
      - "versions.env"
      - "common/**"
  pull_request:
    paths:
      - ".github/workflows/build-k8s-offline.yml"
      - ".gitignore"
      - "README.md"
      - "build.sh"
      - "install.sh"
      - "versions.env"
      - "common/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        bundle:
          - full
          - lite
        cni:
          - cilium
          - calico

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Sealos downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/downloads
            .cache/bin
          key: sealos-downloads-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('common/component-versions.env') }}
          restore-keys: |
            sealos-downloads-${{ runner.os }}-${{ matrix.arch }}-

      - name: Ensure executable permissions
        run: |
          chmod +x build.sh install.sh

      - name: Build package
        id: build_pkg
        shell: bash
        run: |
          set -euo pipefail

          arch="${{ matrix.arch }}"
          bundle="${{ matrix.bundle }}"
          cni="${{ matrix.cni }}"

          mkdir -p dist

          if [ "${cni}" = "calico" ]; then
            echo "Building Calico package: arch=${arch}, bundle=${bundle}"
            ./build.sh --arch "${arch}" --bundle "${bundle}" --cni calico --force

            run_file="dist/k8s-sealos-linux-${arch}-calico-${bundle}.run"
            artifact_name="k8s-sealos-${arch}-calico-${bundle}"
          else
            echo "Building default Cilium package: arch=${arch}, bundle=${bundle}"
            ./build.sh --arch "${arch}" --bundle "${bundle}" --force

            run_file="dist/k8s-sealos-linux-${arch}-${bundle}.run"
            artifact_name="k8s-sealos-${arch}-${bundle}"
          fi

          sha_file="${run_file}.sha256"

          echo "===== dist files ====="
          find dist -maxdepth 2 -type f -print | sort || true
          echo "======================"

          if [ ! -f "${run_file}" ]; then
            echo "::error::Package file not found: ${run_file}"
            echo "::error::Current matrix: arch=${arch}, bundle=${bundle}, cni=${cni}"
            echo "Actual dist files:"
            find dist -maxdepth 2 -type f -print | sort || true
            exit 1
          fi

          if [ ! -f "${sha_file}" ]; then
            echo "::warning::SHA256 file not found, generating: ${sha_file}"
            sha256sum "${run_file}" > "${sha_file}"
          fi

          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "run_file=${run_file}" >> "${GITHUB_OUTPUT}"
          echo "sha_file=${sha_file}" >> "${GITHUB_OUTPUT}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_pkg.outputs.artifact_name }}
          path: |
            ${{ steps.build_pkg.outputs.run_file }}
            ${{ steps.build_pkg.outputs.sha_file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Debug release files
        run: |
          echo "===== release artifacts ====="
          find artifacts -type f -print | sort
          echo "============================="

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
